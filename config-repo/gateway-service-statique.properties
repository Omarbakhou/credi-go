# Profil "statique" : routes déclarées manuellement, instances résolues par Eureka (lb://)
#   http://localhost:8080/clients  ->  service-clients /clients
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=service-clients
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-clients
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/clients/**,/garanties/**

spring.cloud.gateway.server.webflux.routes[1].id=service-credit
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-credit
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/credits/**

spring.cloud.gateway.server.webflux.routes[2].id=service-decaissements
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-decaissements
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/tresoreries/**,/decaissements/**
