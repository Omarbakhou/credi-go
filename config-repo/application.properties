# Configuration commune à TOUTES les applications clientes du Config Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------- V7 : Kafka (docker-compose.yml, mode KRaft) ----------------
spring.kafka.bootstrap-servers=localhost:9092
# Messages JSON transportés sous forme de chaînes (enveloppe EvenementMetier), clé = identifiant métier
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Fiabilité côté producteur : acquittement de tous les réplicas, producteur idempotent (pas de doublon sur retry)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Kafka arrêté : échec rapide, l'événement reste EN_ATTENTE dans l'outbox et sera renvoyé
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=6000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Un groupe de consommateurs par service ; offsets validés après traitement (au moins une fois)
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Transactional outbox : intervalle de publication des événements EN_ATTENTE (ms)
credigo.outbox.intervalle-ms=300
