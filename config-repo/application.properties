# Configuration commune à TOUTES les applications clientes du Config Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,circuitbreakers,retries
management.endpoint.health.show-details=always

# RabbitMQ (docker-compose.yml) : utilisé par service-credit, service-decaissements et notification-service
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=credigo
spring.rabbitmq.password=credigo123

# Propagation rapide du registre Eureka (démo) : un service est visible des autres en quelques secondes
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
spring.cloud.loadbalancer.cache.ttl=5s
