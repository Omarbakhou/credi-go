server.port=8083

# Base H2 en mémoire propre au service (Database per Service), recréée au démarrage
spring.datasource.url=jdbc:h2:mem:decaissementsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Données de démonstration (data.sql) chargées après la création des tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------------- V6 : résilience des appels OpenFeign ----------------
# Timeouts par appel (ms) : un service lent ne bloque pas l'appelant
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Ordre des aspects : Retry englobe le Circuit Breaker
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2

# Retry : 3 tentatives au total, uniquement sur les erreurs transitoires (injoignable, 503)
# Circuit Breaker : ouvert si >= 50 % d'échecs sur 6 appels ; les erreurs 4xx ne comptent pas
management.health.circuitbreakers.enabled=true
resilience4j.retry.instances.service-credit.max-attempts=3
resilience4j.retry.instances.service-credit.wait-duration=500ms
resilience4j.retry.instances.service-credit.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
resilience4j.circuitbreaker.instances.service-credit.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.service-credit.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-credit.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-credit.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-credit.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-credit.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-credit.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.service-credit.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.service-clients.max-attempts=3
resilience4j.retry.instances.service-clients.wait-duration=500ms
resilience4j.retry.instances.service-clients.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
resilience4j.circuitbreaker.instances.service-clients.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.service-clients.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-clients.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-clients.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-clients.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-clients.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-clients.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.service-clients.automatic-transition-from-open-to-half-open-enabled=true

