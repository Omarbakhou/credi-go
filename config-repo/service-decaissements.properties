server.port=8083

# Base H2 en mémoire propre au service (Database per Service), recréée au démarrage
spring.datasource.url=jdbc:h2:mem:decaissementsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Données de démonstration (data.sql) chargées après la création des tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------------- V7 : processus événementiel ----------------
# Une réservation de fonds non versée dans ce délai expire : fonds libérés, disbursement-failed publié
credigo.decaissements.delai-versement=PT10M
credigo.decaissements.verification-ms=10000
