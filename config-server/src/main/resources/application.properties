spring.application.name=config-server
server.port=8888

# --- Mode par défaut : "native" ---------------------------------------------
# Lit les fichiers du dossier config-repo/ à la racine du projet (lancement depuis
# IntelliJ ou depuis le dossier config-server/). Aucun push nécessaire.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo/,file:../config-repo/

# --- Mode "git" (même principe que le TP) ----------------------------------------
# Lancer avec le profil git : --spring.profiles.active=git
# (voir application-git.properties ; le dépôt GitHub doit être public)

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=health,info
